<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="512" height="512">
  <!-- Exact Manthan mark from the reference files: a red circle connected by
       a thin line to a smaller light-colored circle. A subtle ink tile keeps
       the light circle visible in light-theme browser tabs. -->
  <rect width="40" height="40" rx="10" fill="#150c0b"/>
  <circle cx="20" cy="20" r="9" fill="#e0323a"/>
  <line x1="20" y1="20" x2="33" y2="20" stroke="#b9aca7" stroke-width="1.4"/>
  <circle cx="33" cy="20" r="3" fill="#f4ece9"/>
</svg>
